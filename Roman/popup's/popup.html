    <div class="pop-up1">
        <header class="header-pop-up1">
            <div class="header-pop-up-container">
            <div class="phone-block">
                <img class="red-block" src="imgs/Rectangle 6 (1).png" alt="">
                <img class="phone" src="imgs/Vector (1).png" alt="">
            </div>
                <div class="pop-up1-header-txt">
                    <h1>ОБРАТНЫЙ ЗВОНОК</h1>
                    <p>Представьтесь, мы вам перезвоним.</p>
                </div> 
                <img class="krest" src="imgs/крестик.png" alt="">
            </div>
        </header>
        <form class="input-section">
            <div class="inputs">
                <div class="cont-for-inputs-checkbox">
                    <div class="input1">
                        <p>Ваше имя:*</p>
                        <input type="text" name="firstName">
                    </div>
                    <div class="input2">
                        <p>Телефон:*</p> 
                        <input type="text" name="phoneNuber">
                    </div>
                </div>
            </div>
            <div class="checkbox-ilya">
                <div class="checkbox-container">
                    <input class="checkbox" type="checkbox" name="agree">
                    <p>Я согласен на<p class="red-txt">обработку персональны данных</p></p>
                </div>
            </div>
            <div class="obyazatelnoe-container">
                <p>* Обязательное поле</p>
                <button>ОТПРАВИТЬ</button>
            </div></div>
        </form>
    </div>
