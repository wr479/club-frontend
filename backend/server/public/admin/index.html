<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админка товаров</title>
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Админка каталога аккумуляторов</h1>

      <section class="card">
        <h2 id="formTitle">Создать товар</h2>
        <form id="productForm">
          <input type="hidden" id="productId" />
          <div class="grid">
            <label>Название <input id="title" required /></label>
            <label>Бренд <input id="brand" required /></label>
            <label>Цена <input id="price" type="number" step="0.01" required /></label>
            <label>Емкость (Ah) <input id="capacity_ah" type="number" step="0.01" required /></label>
            <label>Напряжение (V) <input id="voltage_v" type="number" step="0.01" required /></label>
            <label>Полярность <input id="polarity" /></label>
            <label>Тип клемм <input id="terminal_type" /></label>
            <label>Ширина (мм) <input id="width_mm" type="number" step="0.01" /></label>
            <label>Высота (мм) <input id="height_mm" type="number" step="0.01" /></label>
            <label>Длина (мм) <input id="length_mm" type="number" step="0.01" /></label>
            <label>Фото товара <input id="imageFile" type="file" accept="image/*" /></label>
            <label>URL фото <input id="image_url" readonly /></label>
            <label class="checkbox">
              <input id="in_stock" type="checkbox" checked />
              В наличии
            </label>
          </div>
          <img id="imagePreview" alt="Превью фото" width="120" height="90" style="display: none;" />
          <div class="actions">
            <button type="submit">Сохранить</button>
            <button type="button" id="resetBtn">Сбросить</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Товары</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Фото</th>
              <th>Название</th>
              <th>Бренд</th>
              <th>Цена</th>
              <th>Наличие</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="productsBody"></tbody>
        </table>
      </section>

      <section class="card">
        <h2>Заявки обратной связи</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Дата</th>
              <th>Имя</th>
              <th>Телефон</th>
              <th>Комментарий</th>
            </tr>
          </thead>
          <tbody id="feedbackBody"></tbody>
        </table>
      </section>
    </main>

    <script src="/admin/app.js"></script>
  </body>
</html>
