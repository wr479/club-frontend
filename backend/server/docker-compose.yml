services:
  postgres:
    image: postgres:16-alpine
    container_name: battery_catalog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: battery_catalog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: battery_catalog_server
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/battery_catalog
    depends_on:
      - postgres
    ports:
      - "3000:3000"

volumes:
  postgres_data:
